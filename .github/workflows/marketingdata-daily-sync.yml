name: Ysabel marketing data daily import
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ysabel-marketing-data-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/refresh-marketingdata.mjs
          sparse-checkout-cone-mode: false
      - name: Import all available connected sources
        env:
          MARKETING_SYNC_SECRET: ${{ secrets.MARKETING_SYNC_SECRET }}
        run: node scripts/refresh-marketingdata.mjs
