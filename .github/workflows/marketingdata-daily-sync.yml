name: Ysabel daily reports and half-hour inbox sync
on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ysabel-marketing-data-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/refresh-marketingdata.mjs
          sparse-checkout-cone-mode: false
      - name: Import connected reports or messages
        env:
          MARKETING_SYNC_SECRET: ${{ secrets.MARKETING_SYNC_SECRET }}
          MARKETING_SYNC_SCOPE: ${{ github.event.schedule == '7,37 * * * *' && 'inbox' || 'all' }}
        run: node scripts/refresh-marketingdata.mjs
