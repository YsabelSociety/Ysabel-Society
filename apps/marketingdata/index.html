      #boot{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(ellipse at 30% 28%,#fff 0%,#fffffff0 18%,transparent 68%),linear-gradient(135deg,#f7faf7,#e7ede8 48%,#d6dfd8)}
