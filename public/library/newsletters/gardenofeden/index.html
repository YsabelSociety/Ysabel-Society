<script>
(() => {
  const film = document.querySelector('.closing-video');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let attempt = 0;

  const shouldPlay = () => !document.hidden && !reducedMotion.matches;

  async function sync() {
    const current = ++attempt;
    if (!shouldPlay()) {
      film.pause();
      return;
    }

    film.muted = false;
    try {
      await film.play();
    } catch (error) {
      if (current !== attempt || !shouldPlay() || error.name !== 'NotAllowedError') return;
      film.muted = true;
      try { await film.play(); } catch (_) {}
    }
  }

  function retryAudiblePlayback(event) {
    if (!event.isTrusted || !shouldPlay() || (!film.muted && !film.paused)) return;
    if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;
    sync();
  }

  document.addEventListener('click', retryAudiblePlayback, { capture: true });
  document.addEventListener('keydown', retryAudiblePlayback);

  document.addEventListener('visibilitychange', sync);
  reducedMotion.addEventListener?.('change', sync);
  sync();
})();
</script>
