<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,noimageindex,nosnippet"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>Ysabel · Private Invitation</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111712;color:#E8E3D8}body{font:16px/1.7 Georgia,serif}.loading{min-height:100vh;display:grid;place-content:center;text-align:center;padding:32px}.brand{font:24px Georgia,serif;letter-spacing:.30em;margin:0 0 16px}.rule{height:1px;width:40px;background:#C49B53;margin:0 auto 20px}.message{font:15px/1.8 Arial,sans-serif;color:#D1D0C5;max-width:410px;margin:0}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style></head>
<body><main class="loading"><p class="brand">YSABEL</p><div class="rule"></div><p class="message" id="message" role="status">Opening your private invitation…</p></main>
<script>
(async()=>{
 const message=document.getElementById('message');
 try{
  const encoded=location.hash.slice(1);
  if(!/^[A-Za-z0-9_-]{43}$/.test(encoded)){message.textContent='Please open the complete private link you received.';return;}
  const raw=Uint8Array.from(atob(encoded.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  async function decrypt(file){
   const response=await fetch(file,{cache:'no-store',referrerPolicy:'no-referrer'});
   if(!response.ok)throw Error('Invitation unavailable');
   const encrypted=new Uint8Array(await response.arrayBuffer());
   return crypto.subtle.decrypt({name:'AES-GCM',iv:encrypted.slice(0,12)},key,encrypted.slice(12));
  }
  const invitation=JSON.parse(new TextDecoder().decode(await decrypt('invitation.bin')));
  let html=invitation.html;
  const blobs=await Promise.all(invitation.assets.map(async asset=>({name:asset.name,url:URL.createObjectURL(new Blob([await decrypt(asset.file)],{type:asset.type}))})));
  for(const asset of blobs)html=html.split(asset.name).join(asset.url);
  const frame=document.createElement('iframe');frame.title='Ysabel Italian seasonal menu invitation';frame.allow='autoplay; fullscreen';frame.referrerPolicy='no-referrer';frame.srcdoc=html;
  document.body.replaceChildren(frame);document.title='Ysabel Italian · New Seasonal Menu';
 }catch(error){message.textContent='This invitation could not be opened. Please check that you have the complete private link and try again.';}
})();
</script></body></html>
